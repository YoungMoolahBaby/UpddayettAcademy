<text x="20.0" y="430.0" font-size="11" fill="#7a808c" text-anchor="start" font-weight="normal">Each night's real board: 17.5 candidate trades and gift chains on average, best set worth 41.3 Goo + Karma. "Left on the table": the best set's</text>
