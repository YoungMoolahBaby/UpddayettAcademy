<text x="80.0" y="398.0" font-size="11.5" fill="#7a808c" text-anchor="start" font-weight="normal">Measured in CortenForge: 12 boards of 20 lone strips, each strip's first 10 waits (all complete). Mean wait 427 units; Kramers predicts 425.</text>
