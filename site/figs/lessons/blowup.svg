<text x="80.0" y="420.0" font-size="11" fill="#7a808c" text-anchor="start" font-weight="normal">Night 1's trades plus gift chains of up to 2 people (the --chain 2 experiment), so the board grows past the game's 17. Both searches find the same valid sets;</text>
<text x="80.0" y="436.0" font-size="11" fill="#7a808c" text-anchor="start" font-weight="normal">the fast one never looks at a set with a collision in it. Times on one core of a Ryzen 5 5600. The street's trades collide a lot, so valid sets are rare:</text>
<text x="80.0" y="452.0" font-size="11" fill="#7a808c" text-anchor="start" font-weight="normal">on a board where nothing collides, every pattern is valid and the green line would climb as steeply as the red.</text>
