<text x="742.0" y="90.0" font-size="12.5" fill="#1d2026" text-anchor="start" font-weight="bold">A magnet, 0.6x, open</text>
<text x="742.0" y="107.0" font-size="11.5" fill="#7a808c" text-anchor="start" font-weight="normal">line: its real field; rings: what the i9 reads</text>
<circle cx="727.0" cy="136.0" r="5.0" fill="#ffffff" stroke="#d99a00" stroke-width="2"/>
<text x="742.0" y="140.0" font-size="12.5" fill="#1d2026" text-anchor="start" font-weight="bold">The same magnet behind the shield</text>
<text x="742.0" y="157.0" font-size="11.5" fill="#7a808c" text-anchor="start" font-weight="normal">10% gets through, and the i9 still reads it</text>
<circle cx="727.0" cy="186.0" r="5.0" fill="#7a808c" stroke="#7a808c" stroke-width="2"/>
<text x="742.0" y="190.0" font-size="12.5" fill="#1d2026" text-anchor="start" font-weight="bold">A clean board</text>
<text x="742.0" y="207.0" font-size="11.5" fill="#7a808c" text-anchor="start" font-weight="normal">the strips' last bit of ringing: the noise floor</text>
<text x="720.0" y="260.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal">Biggest gap between reading and truth:</text>
<text x="720.0" y="278.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal">  open 2 × 10⁻⁶, shielded 3 × 10⁻⁶</text>
<text x="720.0" y="296.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal">Biggest reading on a clean board: 7 × 10⁻⁷</text>
<text x="720.0" y="314.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal"></text>
<text x="720.0" y="332.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal">The smart Salties' coil is off whenever</text>
<text x="720.0" y="350.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal">the drum stops. At idle the i9 reads a</text>
<text x="720.0" y="368.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal">board with the coil in it exactly like a</text>
<text x="720.0" y="386.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal">clean one (biggest reading 7 × 10⁻⁷).</text>
<text x="80.0" y="450.0" font-size="11" fill="#7a808c" text-anchor="start" font-weight="normal">Night 1, the strips at rest after 30 time units with the drum stopped, in CortenForge's Langevin model. The reading is the force balance on each strip.</text>
