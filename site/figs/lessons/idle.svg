<text x="742.0" y="190.0" font-size="12.5" fill="#1d2026" text-anchor="start" font-weight="bold">A clean board</text>
<text x="742.0" y="207.0" font-size="11.5" fill="#7a808c" text-anchor="start" font-weight="normal">the strips' last bit of ringing: the noise floor</text>
<text x="720.0" y="260.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal">Biggest gap between reading and truth:</text>
