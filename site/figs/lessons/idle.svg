<text x="720.0" y="314.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal"></text>
<text x="720.0" y="332.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal">The smart Salties' coil is off whenever</text>
<text x="720.0" y="350.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal">the drum stops. At idle the i9 reads a</text>
<text x="720.0" y="368.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal">board with the coil in it exactly like a</text>
<text x="720.0" y="386.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal">clean one (biggest reading 2 × 10⁻⁶).</text>
<text x="80.0" y="450.0" font-size="11" fill="#7a808c" text-anchor="start" font-weight="normal">Night 3, the strips at rest after 30 time units with the drum stopped, in CortenForge's Langevin model. The reading is the force balance on each strip.</text>
