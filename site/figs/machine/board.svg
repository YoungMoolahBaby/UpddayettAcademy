<text x="20.0" y="30.0" font-size="15" fill="#1d2026" text-anchor="start" font-weight="bold">Night 3: 20 strips, and every line is a collision</text>
<circle cx="660.0" cy="90.0" r="12.0" fill="#3f9a12" stroke="#1d2026" stroke-width="1.5"/>
<text x="682.0" y="95.0" font-size="13" fill="#1d2026" text-anchor="start" font-weight="bold">the best set: 40</text>
<circle cx="660.0" cy="130.0" r="14.0" fill="none" stroke="#d99a00" stroke-width="4"/>
<text x="682.0" y="135.0" font-size="13" fill="#1d2026" text-anchor="start" font-weight="bold">grab-the-biggest-first: 37</text>
<circle cx="660.0" cy="170.0" r="12.0" fill="#ffffff" stroke="#e8761a" stroke-width="3"/>
<text x="682.0" y="175.0" font-size="13" fill="#1d2026" text-anchor="start" font-weight="normal">a gift (scored in Karma, K)</text>
<text x="650.0" y="225.0" font-size="12.5" fill="#1d2026" text-anchor="start" font-weight="normal">Each circle is one candidate trade: a 2-4 way loop</text>
<text x="650.0" y="244.0" font-size="12.5" fill="#1d2026" text-anchor="start" font-weight="normal">where everyone gains. The number is what it's worth.</text>
<text x="650.0" y="263.0" font-size="12.5" fill="#1d2026" text-anchor="start" font-weight="normal">A line joins two trades that need the same item,</text>
<text x="650.0" y="282.0" font-size="12.5" fill="#1d2026" text-anchor="start" font-weight="normal">so at most one of them can happen.</text>
<text x="650.0" y="301.0" font-size="12.5" fill="#1d2026" text-anchor="start" font-weight="normal"></text>
<text x="650.0" y="320.0" font-size="12.5" fill="#1d2026" text-anchor="start" font-weight="normal">Grabbing the biggest trade first looks smart, but it</text>
<text x="650.0" y="339.0" font-size="12.5" fill="#1d2026" text-anchor="start" font-weight="normal">knocks out its neighbors, and they were worth more</text>
<text x="650.0" y="358.0" font-size="12.5" fill="#1d2026" text-anchor="start" font-weight="normal">together. The machine has to weigh every trade</text>
<text x="650.0" y="377.0" font-size="12.5" fill="#1d2026" text-anchor="start" font-weight="normal">against all the others at once.</text>
<text x="650.0" y="396.0" font-size="12.5" fill="#1d2026" text-anchor="start" font-weight="normal"></text>
<text x="650.0" y="415.0" font-size="12.5" fill="#7a808c" text-anchor="start" font-weight="normal">Labels: who hands to whom (U = Upddayett, R =</text>
<text x="650.0" y="434.0" font-size="12.5" fill="#7a808c" text-anchor="start" font-weight="normal">Ranchelle, AP = Amir's Persian Kitchen, ...).</text>
</svg>
