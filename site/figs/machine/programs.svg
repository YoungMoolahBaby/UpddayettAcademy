<text x="80.0" y="395.0" font-size="11" fill="#7a808c" text-anchor="start" font-weight="normal">Measured on nights 1-10, 48 spins each, as the game's program picker shows them. Row: 4 x 235 units + settles, the same total as Normal.</text>
