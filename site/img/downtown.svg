<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230">
  <!-- Market St at dusk: a row of historic storefronts, drawn for Upddayett
       Academy (two-story brick blocks, stone fronts with parapets, awnings,
       acorn streetlamps). Just the architecture, no signs or names; the row
       tiles left to right. -->
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffd58a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd58a" stop-opacity="0"/>
    </radialGradient>
    <style>
      .b1 { fill: #2e1820; } .b2 { fill: #37202a; } .stone { fill: #3d302f; }
      .trim { fill: #1b1016; } .dark { fill: #140b12; } .lit { fill: #efb55a; } .dim { fill: #8f633c; }
      .glass { fill: #e39a4a; opacity: 0.82; } .awn1 { fill: #5e2834; } .awn2 { fill: #2f4a45; }
      .mull { stroke: #1b1016; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <!-- 1. Brick block with a round upper window -->
  <rect class="b1" x="0" y="50" width="232" height="180"/>
  <rect class="trim" x="-2" y="40" width="236" height="6"/>
  <rect class="trim" x="0" y="46" width="232" height="8"/>
  <circle class="trim" cx="52" cy="96" r="28"/>
  <circle class="lit" cx="52" cy="96" r="21"/>
  <path class="mull" d="M31 96H73M52 75V117"/>
  <rect class="dark" x="100" y="70" width="24" height="54"/>
  <rect class="lit" x="140" y="70" width="24" height="54"/>
  <rect class="dark" x="180" y="70" width="24" height="54"/>
  <rect class="trim" x="0" y="138" width="232" height="7"/>
  <rect class="trim" x="8" y="150" width="216" height="80"/>
  <rect class="dim" x="14" y="155" width="204" height="8"/>
  <rect class="glass" x="14" y="168" width="94" height="56"/>
  <rect class="dark" x="112" y="168" width="10" height="62"/>
  <rect class="glass" x="126" y="168" width="92" height="56"/>

  <!-- 2. Taller brick block, segmental-arch windows, an awning -->
  <rect class="b2" x="232" y="40" width="240" height="190"/>
  <rect class="trim" x="228" y="30" width="248" height="12"/>
  <rect class="trim" x="236" y="42" width="8" height="10"/><rect class="trim" x="460" y="42" width="8" height="10"/>
  <path class="trim" d="M248 68 Q270 56 292 68 Z M302 68 Q324 56 346 68 Z M356 68 Q378 56 400 68 Z M410 68 Q432 56 454 68 Z"/>
  <rect class="lit" x="252" y="68" width="36" height="58"/>
  <rect class="dark" x="306" y="68" width="36" height="58"/>
  <rect class="dim" x="360" y="68" width="36" height="58"/>
  <rect class="dark" x="414" y="68" width="36" height="58"/>
  <rect class="trim" x="232" y="138" width="240" height="7"/>
  <rect class="glass" x="250" y="168" width="212" height="58"/>
  <path class="mull" d="M320 168V226M392 168V226"/>
  <path class="awn1" d="M240 148 H464 L456 168 H248 Z"/>

  <!-- 3. Brick block with round-arched windows and a green door -->
  <rect class="b1" x="472" y="58" width="180" height="172"/>
  <rect class="trim" x="468" y="50" width="188" height="9"/>
  <path class="dark" d="M492 134 V96 A16 16 0 0 1 524 96 V134 Z"/>
  <path class="lit" d="M546 134 V96 A16 16 0 0 1 578 96 V134 Z"/>
  <path class="dark" d="M600 134 V96 A16 16 0 0 1 632 96 V134 Z"/>
  <path class="mull" d="M489 96 A19 19 0 0 1 527 96 M543 96 A19 19 0 0 1 581 96 M597 96 A19 19 0 0 1 635 96"/>
  <rect class="trim" x="472" y="142" width="180" height="6"/>
  <rect class="trim" x="476" y="152" width="172" height="78"/>
  <rect class="glass" x="482" y="160" width="116" height="64"/>
  <rect fill="#3d5a44" x="606" y="158" width="38" height="72"/>

  <!-- 4. A narrow storefront with a sign board -->
  <rect class="b2" x="652" y="76" width="120" height="154"/>
  <rect class="trim" x="648" y="68" width="128" height="9"/>
  <rect class="lit" x="668" y="92" width="32" height="42"/>
  <rect class="dark" x="724" y="92" width="32" height="42"/>
  <rect class="trim" x="652" y="142" width="120" height="26"/>
  <rect class="glass" x="660" y="172" width="104" height="54"/>

  <!-- 5. Stone front with a curved parapet, window hoods and small awnings -->
  <rect class="stone" x="772" y="50" width="220" height="180"/>
  <path class="stone" d="M772 50 V40 H850 Q882 6 914 40 H992 V50 Z"/>
  <path class="trim" d="M772 48 H992 V54 H772 Z M862 30 Q882 14 902 30 Z"/>
  <rect class="trim" x="792" y="68" width="42" height="6"/><rect class="trim" x="862" y="68" width="42" height="6"/><rect class="trim" x="932" y="68" width="42" height="6"/>
  <rect class="dark" x="796" y="76" width="34" height="50"/>
  <rect class="lit" x="866" y="76" width="34" height="50"/>
  <rect class="dim" x="936" y="76" width="34" height="50"/>
  <path class="awn2" d="M932 76 h42 l-6 12 h-30 z"/>
  <rect class="trim" x="772" y="140" width="220" height="7"/>
  <rect class="trim" x="778" y="150" width="208" height="80"/>
  <rect class="glass" x="784" y="166" width="92" height="58"/>
  <rect class="glass" x="886" y="166" width="94" height="58"/>
  <path class="awn2" d="M880 150 H988 L982 166 H886 Z"/>

  <!-- 6. Stone front with a bay window -->
  <rect class="stone" x="992" y="52" width="208" height="178"/>
  <path class="stone" d="M992 52 V42 H1060 Q1096 8 1132 42 H1200 V52 Z"/>
  <path class="trim" d="M992 50 H1200 V56 H992 Z"/>
  <rect class="dark" x="1012" y="76" width="32" height="50"/>
  <rect class="lit" x="1056" y="76" width="32" height="50"/>
  <rect class="trim" x="1108" y="66" width="70" height="72"/>
  <rect class="lit" x="1114" y="74" width="18" height="56"/>
  <rect class="dim" x="1136" y="74" width="18" height="56"/>
  <rect class="lit" x="1158" y="74" width="14" height="56"/>
  <rect class="trim" x="992" y="142" width="208" height="7"/>
  <rect class="trim" x="998" y="152" width="196" height="78"/>
  <rect class="glass" x="1004" y="166" width="100" height="58"/>
  <rect class="glass" x="1112" y="166" width="76" height="58"/>
  <path class="awn1" d="M1000 152 H1192 L1186 166 H1006 Z"/>

  <!-- Acorn streetlamps between the blocks -->
  <g>
    <circle cx="232" cy="150" r="28" fill="url(#glow)"/><rect x="230" y="152" width="4" height="78" fill="#0f080d"/><circle cx="232" cy="148" r="7" fill="#ffe2a6"/>
    <circle cx="472" cy="150" r="28" fill="url(#glow)"/><rect x="470" y="152" width="4" height="78" fill="#0f080d"/><circle cx="472" cy="148" r="7" fill="#ffe2a6"/>
    <circle cx="992" cy="150" r="28" fill="url(#glow)"/><rect x="990" y="152" width="4" height="78" fill="#0f080d"/><circle cx="992" cy="148" r="7" fill="#ffe2a6"/>
  </g>
</svg>
