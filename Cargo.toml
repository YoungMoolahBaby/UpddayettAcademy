[package]
name = "cortenforge_play"
version = "0.1.0"
edition = "2024"

[dependencies]
cortenforge = "0.9.0"
nalgebra = "0.34"
bevy = { version = "0.19.1", features = ["area_light_luts"] }
bevy_egui = "0.42.0"

[features]
default = ["solari"]
# Ray-traced lighting (Bevy Solari). Needs a GPU with hardware ray tracing;
# F2 toggles it in game (off at start).
solari = ["bevy/bevy_solari"]
