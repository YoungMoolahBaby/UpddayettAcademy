[package]
name = "cortenforge_play"
version = "0.1.0"
edition = "2024"

[dependencies]
cortenforge = "0.9.0"
nalgebra = "0.34"
bevy = { version = "0.19.1", features = ["area_light_luts", "mp3", "flac", "wav"] }
# The tape deck (Step 8) checks a dropped file with the same decoder Bevy uses
# (Bevy unwraps it: a bad file would crash the game). Same version as Bevy.
rodio = { version = "0.22", default-features = false }
bevy_egui = "0.42.0"

[features]
default = ["solari"]
# Ray-traced lighting (Bevy Solari). Needs a GPU with hardware ray tracing;
# F2 toggles it in game (off at start).
solari = ["bevy/bevy_solari"]

[dev-dependencies]
# rematch: sim-opt's bootstrap takes a rand 0.9 Rng and doesn't re-export rand.
rand = "0.9"
