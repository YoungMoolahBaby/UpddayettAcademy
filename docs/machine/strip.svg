<text x="70.0" y="30.0" font-size="15" fill="#1d2026" text-anchor="start" font-weight="bold">One strip, three situations</text>
<line x1="560.0" y1="80.0" x2="584.0" y2="80.0" stroke="#7a808c" stroke-width="3"/>
<text x="592.0" y="84.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal">Alone: two equal dips, off and on,</text>
<text x="592.0" y="102.0" font-size="12" fill="#7a808c" text-anchor="start" font-weight="normal">a hump of 5 kT between them.</text>
<line x1="560.0" y1="150.0" x2="584.0" y2="150.0" stroke="#3f9a12" stroke-width="3"/>
<text x="592.0" y="154.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal">Tonight's best trade, others off:</text>
<text x="592.0" y="172.0" font-size="12" fill="#7a808c" text-anchor="start" font-weight="normal">tilted toward on by a field of 3.7.</text>
<line x1="560.0" y1="220.0" x2="584.0" y2="220.0" stroke="#d8392b" stroke-width="3"/>
<text x="592.0" y="224.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal">Same trade, a colliding trade on:</text>
<text x="592.0" y="242.0" font-size="12" fill="#7a808c" text-anchor="start" font-weight="normal">its spring tips it back toward off.</text>
<text x="560.0" y="305.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal">The drum's shaking (kT) decides how</text>
<text x="560.0" y="323.0" font-size="12" fill="#1d2026" text-anchor="start" font-weight="normal">often a strip gets kicked over the hump.</text>
<text x="70.0" y="380.0" font-size="11" fill="#7a808c" text-anchor="start" font-weight="normal">Curves: CortenForge's DoubleWellPotential (dV = 5, x0 = 1) minus the field term h x. Fields from night 1's real board.</text>
</svg>
