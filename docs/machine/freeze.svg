<text x="568.0" y="78.0" font-size="13" fill="#1d2026" text-anchor="start" font-weight="bold">Night 1's board, 12 spins</text>
<text x="568.0" y="96.0" font-size="11.5" fill="#1d2026" text-anchor="start" font-weight="normal">Springs and fields tilt the dips, so a</text>
<text x="568.0" y="112.0" font-size="11.5" fill="#1d2026" text-anchor="start" font-weight="normal">strip in its good dip hops even less.</text>
<text x="80.0" y="395.0" font-size="11.5" fill="#7a808c" text-anchor="start" font-weight="normal">Each tenfold drop in hopping takes only a modest drop in kT: the rate goes as e^(-hump / kT). Cool too fast and the strips freeze</text>
<text x="80.0" y="412.0" font-size="11.5" fill="#7a808c" text-anchor="start" font-weight="normal">wherever they happen to be (a quench). Cool slowly and they keep finding better dips on the way down (an anneal).</text>
