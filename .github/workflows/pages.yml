# Deploys site/ (upddayettacademy.com) to GitHub Pages on every push that
# touches the site, or by hand. The custom domain is set in the repo's Pages
# settings (site/CNAME records it too).
name: Deploy site

on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Stamp the stylesheet link with this commit, so a new deploy never
      # pairs new pages with a stylesheet the browser cached (Pages caches 10 min).
      - name: Cache-bust the stylesheet
        run: find site -name '*.html' -exec sed -i "s#site.css?v=[A-Za-z0-9]*#site.css?v=${GITHUB_SHA::8}#" {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
