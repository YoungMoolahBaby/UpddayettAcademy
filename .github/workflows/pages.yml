# Deploys site/ (upddayettacademy.com) to GitHub Pages.
# Manual for now: Pages isn't switched on yet. Once it is, add
#   push: { branches: [master], paths: ['site/**', '.github/workflows/pages.yml'] }
# under `on:` so every push to the site deploys.
name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
